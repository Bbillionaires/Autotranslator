services:
  postgres:
    image: postgres:16
    container_name: autotranslator-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Local development credentials only — never used in production.
      POSTGRES_USER: autotranslator
      POSTGRES_PASSWORD: autotranslator_dev_password
      POSTGRES_DB: autotranslator
    volumes:
      - autotranslator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotranslator -d autotranslator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autotranslator_postgres_data:
